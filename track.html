<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الشحنات | MIRNOX</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="icon" href="logo/MIRNOX logo.jpg"></head><body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="logo/MIRNOX logo.jpg"><span class="brand-name"><b>MIRNOX</b><small>LUXURY WATCHES</small></span></a><nav class="links"><a href="index.html">الرئيسية</a><a href="shop.html">تسوق</a><a href="track.html" class="active">تتبع شحنتك</a><a href="policy.html">سياسة التعامل</a><a href="contact.html">تواصل مع خدمة العملاء</a></nav><div class="actions"><a href="cart.html" class="cart-btn">🛒<span class="cart-count">0</span></a><button class="burger">☰</button></div></div></header>
<section class="section container" style="max-width:700px">
<div class="kicker">تتبع الشحنات 📦</div><h2 style="color:#0b3b2e">فين الأوردر بتاعي؟</h2>
<div class="panel"><div style="display:flex;gap:.5rem"><input id="t" class="input" placeholder="دخل رقم الأوردر MNX-....." dir="ltr" style="text-align:center;font-weight:900"><button class="btn btn-gold" onclick="go()">تتبع</button></div>
<p style="font-size:.9rem;color:#6b7a74">اكتب الرقم اللي اتبعتلك في ايميل تأكيد الأوردر.</p>
<div id="res"></div></div>
<div class="panel" style="margin-top:1rem"><h3>شركاء الشحن</h3><p>Bosta • Aramex • J&T — التوصيل خلال 2-4 أيام عمل. القاهرة والجيزة 1-2 يوم. الشحن مجاني فوق 5000 ج.</p></div>
</section>
<footer><div class="copy">© 2026 MIRNOX</div></footer>
<script src="assets/js/store.js"></script>
<script>
const DEMO={'MNX-48291':{name:'عميل تجريبي',total:'6,850 ج.م',date:'2026/09/15',status:2}};
function go(){
  const v=document.getElementById('t').value.trim()||location.hash.slice(1);
  const orders={...DEMO,...JSON.parse(localStorage.getItem('mirnox_orders')||'{}')};
  const o=orders[v];
  const box=document.getElementById('res');
  if(!o){box.innerHTML=`<div class="panel" style="background:#fdecea;border-color:#e8a0a0">❌ مفيش أوردر بالرقم ده. اتأكد من الرقم أو كلم <a href="contact.html" style="font-weight:900">خدمة العملاء</a>.</div>`;return;}
  const steps=['تم استلام الطلب','التجهيز والتغليف','مع شركة الشحن','خارج للتوصيل','تم التوصيل ✅'];
  box.innerHTML=`<hr><p>أوردر <b dir="ltr">${v}</b> • باسم ${o.name} • ${o.total?('الإجمالي '+o.total):''}</p>
  <div class="timeline">${steps.map((s,i)=>`<div class="step ${i<=o.status?'done':''}"><b>${s}</b><div style="color:#6b7a74;font-size:.88rem">${i<=o.status?'تم ✔':'في الانتظار...'}</div></div>`).join('')}</div>
  <a class="btn btn-green" href="contact.html">عندك مشكلة؟ كلم خدمة العملاء</a>`;
}
if(location.hash.length>1){document.getElementById('t').value=location.hash.slice(1);go();}
</script></body></html>
