<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المنتج | MIRNOX</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><link rel="icon" href="logo/MIRNOX logo.jpg">
</head><body>
<header class="header"><div class="container nav">
<a class="brand" href="index.html"><img class="brand-logo" src="logo/MIRNOX logo.jpg"><span class="brand-name"><b>MIRNOX</b><small>LUXURY WATCHES</small></span></a>
<nav class="links"><a href="index.html">الرئيسية</a><a href="shop.html" class="active">تسوق</a><a href="track.html">تتبع شحنتك</a><a href="policy.html">سياسة التعامل</a><a href="contact.html">تواصل مع خدمة العملاء</a></nav>
<div class="actions"><a href="cart.html" class="cart-btn">🛒<span class="cart-count">0</span></a><button class="burger">☰</button></div>
</div></header>
<section class="section container" id="wrap"><p>جاري التحميل...</p></section>
<section class="section container"><div class="sec-head"><div><div class="kicker">ممكن يعجبك</div><h2>منتجات مشابهة</h2></div></div><div class="grid-products" id="rel"></div></section>
<footer><div class="container foot"><div><h4>MIRNOX</h4><p style="color:#9db8ad">أصلي 100% • ضمان سنتين.</p></div><div><h4>تسوق</h4><a href="shop.html">كل الساعات</a><a href="cart.html">السلة</a></div><div><h4>مساعدة</h4><a href="track.html">تتبع</a><a href="policy.html">سياسة التعامل</a><a href="contact.html">خدمة العملاء</a></div></div><div class="copy">© 2026 MIRNOX</div></footer>
<script src="assets/js/products.js"></script><script src="assets/js/store.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];
document.title=p.name+' | MIRNOX';
let selColor=p.colors[0].name, selImg=p.colors[0].img, qty=1, autoT=null, paused=false;
function paint(){
  const mi=document.getElementById('mainImg');
  if(mi.getAttribute('src')!==selImg){
    mi.style.opacity=0;
    mi.src=selImg;
    mi.onload=()=>{mi.style.opacity=1;};
    setTimeout(()=>{mi.style.opacity=1;},600);
  }
  document.querySelectorAll('.thumbs img').forEach(t=>t.classList.toggle('active',t.src===selImg));
  document.querySelectorAll('.color-btn').forEach(b=>b.classList.toggle('active',b.dataset.n===selColor));
  document.getElementById('q').textContent=qty;
  document.getElementById('selName').textContent=selColor;
  scheduleAuto();
}
function scheduleAuto(){
  clearTimeout(autoT);
  autoT=setTimeout(()=>{
    if(!paused && !document.hidden){
      const i=(p.images.indexOf(selImg)+1)%p.images.length;
      selImg=p.images[i];
      const cc=p.colors.find(c=>c.img===selImg);
      if(cc) selColor=cc.name;
    }
    paint();
  },4000);
}
document.getElementById('wrap').innerHTML=`
<div style="margin-bottom:.8rem"><a href="shop.html">← رجوع للمتجر</a></div>
<div class="pd">
 <div>
  <div class="gallery-main" onmouseenter="paused=true" onmouseleave="paused=false"><img id="mainImg" src="${selImg}"></div>
  <div class="thumbs">${p.images.map((im,i)=>`<img src="${im}" class="${i===0?'active':''}" onclick="selImg='${im}';paint()">`).join('')}</div>
 </div>
 <div>
  ${p.badge?`<span class="badge" style="position:static">${p.badge}</span>`:''}
  <h1 style="color:#0b3b2e;margin:.4rem 0">${p.name}</h1>
  <div>${stars(p.rating)} <b>${p.rating}</b> <span style="color:#6b7a74">(${p.reviews} تقييم موثق ✔)</span></div>
  <div class="price-row" style="margin:.6rem 0"><span class="price" style="font-size:1.7rem">${fmt(p.price)}</span>${p.old?`<span class="old">${fmt(p.old)}</span><span class="badge" style="position:static">وفّر ${(p.old-p.price).toLocaleString('ar-EG')} ج</span>`:''}</div>
  <div class="opt-label">🎨 اللون: <span id="selName" style="color:#9a7a35"></span></div>
  <div class="color-pick">${p.colors.map(c=>`<button class="color-btn" data-n="${c.name}" onclick="selColor='${c.name}';selImg='${c.img}';paint()"><span class="dot" style="background:${c.hex}"></span>${c.name}</button>`).join('')}</div>
  <div class="opt-label">الكمية</div>
  <div class="qty"><button onclick="qty=Math.max(1,qty-1);paint()">−</button><b id="q">1</b><button onclick="qty++;paint()">+</button>
  <span style="color:#146049;font-weight:800">✔ متاح — شحن خلال 24 ساعة</span></div>
  <div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap">
    <button class="btn btn-gold" style="flex:1;justify-content:center" onclick="addToCart('${p.id}',selColor,qty)">أضف للسلة 🛒</button>
    <button class="btn btn-green" style="flex:1;justify-content:center" onclick="addToCart('${p.id}',selColor,qty);location.href='checkout.html'">اشتري دلوقتي ⚡</button>
  </div>
  <div style="display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap;font-size:.9rem;color:#146049;font-weight:700">
    <span>🚚 شحن سريع</span><span>🛡️ ضمان سنتين</span><span>↩️ إرجاع 14 يوم</span><span>💳 دفع آمن</span>
  </div>
 </div>
</div>
<div class="tabs">
 <div class="tab-head"><button class="active" onclick="tab(0,this)">الوصف</button><button onclick="tab(1,this)">المواصفات والتفاصيل</button><button onclick="tab(2,this)">التقييمات (${p.reviews})</button></div>
 <div class="tab-body" id="tb"></div>
</div>`;
function tab(i,btn){
  document.querySelectorAll('.tab-head button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const tb=document.getElementById('tb');
  if(i===0) tb.innerHTML=`<p>${p.desc}</p><p>📦 <b>محتويات العلبة:</b> الساعة + علبة MIRNOX الخضراء الفاخرة + كارت ضمان مختوم + كتيب تعليمات + منديل تلميع هدية.</p>`;
  if(i===1) tb.innerHTML=`<table class="spec-table">${Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;
  if(i===2) tb.innerHTML=`
    <div class="panel" style="background:#faf6ec">⭐⭐⭐⭐⭐ <b>أحمد م.</b> <small>— القاهرة • مشتري موثق</small><p>الخامة تحفة والتغليف شيك جداً. اللون الأخضر على الطبيعة أحلى من الصور.</p></div>
    <div class="panel" style="background:#faf6ec;margin-top:.6rem">⭐⭐⭐⭐⭐ <b>سارة خ.</b> <small>— الإسكندرية • مشتري موثق</small><p>جبتها هدية لجوزي، والضمان والتعامل محترم. الشحن وصل في يومين.</p></div>
    <div class="panel" style="margin-top:.6rem"><b>قيّم المنتج</b><div style="font-size:1.6rem;color:#d9a521;cursor:pointer" id="ur">★★★★★</div><div class="form-grid" style="margin-top:.5rem"><input class="input" placeholder="اسمك"><input class="input" placeholder="تقييمك من 5"></div><textarea class="input" style="margin-top:.5rem" placeholder="اكتب رأيك..."></textarea><button class="btn btn-green" style="margin-top:.5rem" onclick="toast('شكراً! تقييمك اتسجل وهيظهر بعد المراجعة')">إرسال التقييم</button></div>`;
  window.scrollTo({top:document.getElementById('tb').offsetTop-140,behavior:'smooth'});
}
tab(0,document.querySelector('.tab-head button'));
paint();
document.getElementById('rel').innerHTML=PRODUCTS.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('');
revealInit();
</script></body></html>
