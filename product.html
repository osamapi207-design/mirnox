<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var L=localStorage.getItem('mirnox_lang');if(L!=='ar'&&L!=='en'){L=((navigator.language||'en').toLowerCase().indexOf('ar')===0)?'ar':'en';}document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';}catch(e){}</script>
<title>المنتج | MIRNOX</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css"><link rel="icon" href="logo/MIRNOX logo.jpg">
</head><body data-page="product">
<header class="header"><div class="container nav">
<a class="brand" href="index.html"><img class="brand-logo" src="logo/MIRNOX logo.jpg"><span class="brand-name"><b>MIRNOX</b><small>LUXURY WATCHES</small></span></a>
<nav class="links"><a href="index.html" data-i18n="nav_home">الرئيسية</a><a href="shop.html" class="active" data-i18n="nav_shop">تسوق</a><a href="track.html" data-i18n="nav_track">تتبع شحنتك</a><a href="policy.html" data-i18n="nav_policy">سياسة التعامل</a><a href="contact.html" data-i18n="nav_contact">تواصل مع خدمة العملاء</a></nav>
<div class="actions"><button class="lang-btn" onclick="toggleLang()">EN</button><a href="cart.html" class="cart-btn">🛒<span class="cart-count">0</span></a><button class="burger">☰</button></div>
</div></header>
<section class="section container" id="wrap"><p>...</p></section>
<section class="section container"><div class="sec-head"><div><div class="kicker" data-i18n="rel_k">ممكن يعجبك</div><h2 data-i18n="rel_h">منتجات مشابهة</h2></div></div><div class="grid-products" id="rel"></div></section>
<footer><div class="container foot"><div><h4>MIRNOX</h4><p style="color:#9db8ad" data-i18n="ft_orig">أصلي 100% • ضمان سنتين.</p></div><div><h4 data-i18n="ft_shop">تسوق</h4><a href="shop.html" data-i18n="ft_all">كل الساعات</a><a href="cart.html" data-i18n="ft_cart">السلة</a></div><div><h4 data-i18n="ft_help">مساعدة</h4><a href="track.html" data-i18n="nav_track">تتبع</a><a href="policy.html" data-i18n="ft_policy">سياسة التعامل</a><a href="contact.html" data-i18n="ft_contact">خدمة العملاء</a></div></div><div class="copy" data-i18n="ft_copy_s">© 2026 MIRNOX</div></footer>
<script src="assets/js/products.js"></script><script src="assets/js/i18n.js"></script><script src="assets/js/store.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];
let selColor=p.colors[0].name, selImg=p.colors[0].img, qty=1, autoT=null, paused=false, curTab=0;
function paint(){
  const mi=document.getElementById('mainImg');
  if(mi && mi.getAttribute('src')!==selImg){
    mi.style.opacity=0;
    mi.src=selImg;
    mi.onload=()=>{mi.style.opacity=1;};
    setTimeout(()=>{mi.style.opacity=1;},600);
  }
  document.querySelectorAll('.thumbs img').forEach(tn=>tn.classList.toggle('active',tn.src===selImg));
  document.querySelectorAll('.color-btn').forEach(b=>b.classList.toggle('active',b.dataset.n===selColor));
  const q=document.getElementById('q'); if(q) q.textContent=qty;
  const sn=document.getElementById('selName'); if(sn) sn.textContent=cname(selColor);
  scheduleAuto();
}
function scheduleAuto(){
  clearTimeout(autoT);
  autoT=setTimeout(()=>{
    if(!paused && !document.hidden){
      const i=(p.images.indexOf(selImg)+1)%p.images.length;
      selImg=p.images[i];
      const cc=p.colors.find(c=>c.img===selImg);
      if(cc) selColor=cc.name;
    }
    paint();
  },4000);
}
function pickImg(im){
  selImg=im;
  const cc=p.colors.find(c=>c.img===im);
  if(cc) selColor=cc.name;
  paint();
}
function buildPD(){
  document.title=pname(p)+' | MIRNOX';
  document.getElementById('wrap').innerHTML=
`<div style="margin-bottom:.8rem"><a href="shop.html">${t('pd_back')}</a></div>
<div class="pd">
 <div>
  <div class="gallery-main" onmouseenter="paused=true" onmouseleave="paused=false"><img id="mainImg" src="${selImg}"></div>
  <div class="thumbs">${p.images.map(im=>`<img src="${im}" onclick="pickImg('${im}')">`).join('')}</div>
 </div>
 <div>
  ${p.badge?`<span class="badge" style="position:static">${badgeTx(p.badge)}</span>`:''}
  <h1 style="color:#0b3b2e;margin:.4rem 0">${pname(p)}</h1>
  <div>${stars(p.rating)} <b>${p.rating}</b> <span style="color:#6b7a74">(${num(p.reviews)} ${t('card_reviews')} ✔)</span></div>
  <div class="price-row" style="margin:.6rem 0"><span class="price" style="font-size:1.7rem">${fmt(p.price)}</span>${p.old?`<span class="old">${fmt(p.old)}</span><span class="badge" style="position:static">${t('save')} ${money(p.old-p.price)}</span>`:''}</div>
  <div class="opt-label">${t('pd_color')} <span id="selName" style="color:#9a7a35"></span></div>
  <div class="color-pick">${p.colors.map(c=>`<button class="color-btn" data-n="${c.name}" onclick="selColor='${c.name}';selImg='${c.img}';paint()"><span class="dot" style="background:${c.hex}"></span>${cname(c.name)}</button>`).join('')}</div>
  <div class="opt-label">${t('pd_qty')}</div>
  <div class="qty"><button onclick="qty=Math.max(1,qty-1);paint()">−</button><b id="q">1</b><button onclick="qty++;paint()">+</button>
  <span style="color:#146049;font-weight:800">${t('pd_avail')}</span></div>
  <div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap">
    <button class="btn btn-gold" style="flex:1;justify-content:center" onclick="addToCart('${p.id}',selColor,qty)">${t('pd_add')}</button>
    <button class="btn btn-green" style="flex:1;justify-content:center" onclick="addToCart('${p.id}',selColor,qty);location.href='checkout.html'">${t('pd_buy')}</button>
  </div>
  <div style="display:flex;gap:.6rem;margin-top:.8rem;flex-wrap:wrap;font-size:.9rem;color:#146049;font-weight:700" data-i18n="pd_trust">
    <span>🚚 شحن سريع</span><span>🛡️ ضمان سنتين</span><span>↩️ إرجاع 14 يوم</span><span>💳 دفع آمن</span>
  </div>
 </div>
</div>
<div class="tabs">
 <div class="tab-head"><button class="active" onclick="tab(0,this)">${t('tab_desc')}</button><button onclick="tab(1,this)">${t('tab_specs')}</button><button onclick="tab(2,this)">${t('tab_reviews')} (${num(p.reviews)})</button></div>
 <div class="tab-body" id="tb"></div>
</div>`;
  tab(curTab,document.querySelector('.tab-head button'),false);
  paint();
}
function tab(i,btn,scroll){
  curTab=i;
  document.querySelectorAll('.tab-head button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const tb=document.getElementById('tb');
  if(i===0) tb.innerHTML=`<p>${pdesc(p)}</p><p>${t('pd_box')}</p>`;
  if(i===1) tb.innerHTML=`<table class="spec-table">${Object.entries(p.specs).map(([k,v])=>`<tr><td>${skey(k)}</td><td>${sval(v)}</td></tr>`).join('')}</table>`;
  if(i===2) tb.innerHTML=
    `<div class="panel" style="background:#faf6ec">⭐⭐⭐⭐⭐ <b>${t('rv1_n')}</b> <small>— ${t('rv1_c')} • ${t('verified')}</small><p>${t('rv1_t')}</p></div>
    <div class="panel" style="background:#faf6ec;margin-top:.6rem">⭐⭐⭐⭐⭐ <b>${t('rv2_n')}</b> <small>— ${t('rv2_c')} • ${t('verified')}</small><p>${t('rv2_t')}</p></div>
    <div class="panel" style="margin-top:.6rem"><b>${t('pd_rate_h')}</b><div style="font-size:1.6rem;color:#d9a521">★★★★★</div><div class="form-grid" style="margin-top:.5rem"><input class="input" placeholder="${t('pd_rate_name')}"><input class="input" placeholder="5 / 5"></div><textarea class="input" style="margin-top:.5rem" placeholder="${t('pd_rate_ph')}"></textarea><button class="btn btn-green" style="margin-top:.5rem" onclick="toast(t('pd_rate_ok'))">${t('pd_rate_btn')}</button></div>`;
  if(scroll!==false){try{window.scrollTo({top:document.getElementById('tb').offsetTop-140,behavior:'smooth'});}catch(e){}}
}
function renderRel(){document.getElementById('rel').innerHTML=PRODUCTS.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('');}
buildPD();
renderRel();
revealInit();
function rerenderLang(){buildPD();renderRel();revealInit();}
</script></body></html>
